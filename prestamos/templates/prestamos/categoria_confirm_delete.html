{% extends 'base.html' %}

{% block titulo %}Eliminar categoría | Herramientas en Común{% endblock %}

{% block contenido %}
    <h1>Eliminar categoría</h1>
    <p>¿Seguro que quieres eliminar <strong>{{ categoria }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'prestamos:categoria_list' %}">Cancelar</a>
    </form>
{% endblock %}
