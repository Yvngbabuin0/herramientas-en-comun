{% extends 'base.html' %}

{% block titulo %}{% if object %}Editar{% else %}Nueva{% endif %} herramienta | Herramientas en Común{% endblock %}

{% block contenido %}
    <h1>{% if object %}Editar{% else %}Nueva{% endif %} herramienta</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'prestamos:herramienta_list' %}">Cancelar</a>
    </form>
{% endblock %}
