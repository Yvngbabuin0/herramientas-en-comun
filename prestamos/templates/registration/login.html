{% extends 'base.html' %}

{% block titulo %}Iniciar sesión | Herramientas en Común{% endblock %}

{% block contenido %}
    <h1>Iniciar sesión</h1>
    <form method="post" class="ficha">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>
{% endblock %}
