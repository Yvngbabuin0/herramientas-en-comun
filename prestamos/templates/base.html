<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Herramientas en Común{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'prestamos:inicio' %}">Inicio</a>
                {% if user.is_staff %}
                    <a href="{% url 'admin:index' %}">Administración</a>
                {% endif %}
                <span>Conectado como <strong>{{ user.get_full_name|default:user.get_username }}</strong></span>
                <form method="post" action="{% url 'prestamos:logout' %}" style="display: inline">
                    {% csrf_token %}
                    <button type="submit">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'prestamos:login' %}">Iniciar sesión</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
